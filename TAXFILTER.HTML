<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPR - PRD MATCHING</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>body{font-family:Segoe UI;padding:15px;background:#f0fdf4}h1{color:#15803d}h3{margin:10px 0 5px}input,select{width:95%;padding:11px;border:2px solid #15803d;border-radius:8px;background:#fff;margin:5px 0}button{width:100%;padding:13px;background:#15803d;color:#fff;border:none;border-radius:10px;font-weight:700;margin:8px 0;font-size:16px}.box{background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 8px #ddd;margin-bottom:12px}.card{display:flex;gap:8px;flex-wrap:wrap}.card div{flex:1;min-width:110px;background:#fff;padding:10px;border-radius:10px;text-align:center;box-shadow:0 1px 5px #ddd}.card b{font-size:22px;display:block;color:#15803d}table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{background:#15803d;color:#fff}</style>
</head>
<body>
<h1>✅ SPR - PRD MATCHING</h1>

<div class="box">
<h3>STEP 1: SPR Sheet Upload Karo (1 file)</h3>
<input type="file" id="sprFile" accept=".xlsx,.xls,.csv">
<p id="sprInfo">SPR abhi upload nahi hui</p>
<label>SPR me Family ID wala Column chuno:</label>
<select id="sprCol"></select>
</div>

<div class="box">
<h3>STEP 2: PRD Sheets Upload Karo (1,2,3,4,5... Jitni ho)</h3>
<input type="file" id="prdFiles" accept=".xlsx,.xls,.csv" multiple>
<p id="prdInfo">PRD abhi upload nahi hui</p>
<label>PRD me Family ID wala Column chuno:</label>
<select id="prdCol"></select>
</div>

<button onclick="process()">🔍 MATCH KARO - REMAINING SPR NIKALO</button>

<div class="card">
<div>Total SPR<b id="c1">0</b></div>
<div>SPR Unique Family<b id="c2">0</b></div>
<div>PRD Unique Family<b id="c3">0</b></div>
<div>Match Ho Gaya<b id="c4">0</b></div>
<div style="background:#dcfce7">Remaining SPR<b id="c5" style="color:#dc2626">0</b></div>
</div>
<br>
<div class="box">
<input type="text" id="search" placeholder="Remaining me Naam / Gaon / Family ID se khojo..." onkeyup="doSearch()">
</div>
<div style="overflow:auto"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
<br>
<button onclick="download()">⬇️ REMAINING SPR Excel Download Karo</button>
<button onclick="downloadMatched()" style="background:#2563eb">⬇️ Matched Wali Download Karo</button>

<script>
let sprHeaders=[], sprData=[], prdHeaders=[], prdData=[];
let remaining=[], matched=[];

function readFile(file){
return new Promise(res=>{
let r=new FileReader();
r.onload=ev=>{
let wb=XLSX.read(ev.target.result,{type:'array'});
let ws=wb.Sheets[wb.SheetNames[0]];
let aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
res(aoa);
};
r.readAsArrayBuffer(file);
});
}
function findFamilyCol(headers){
let idx=headers.findIndex(h=>String(h).toLowerCase().replace(/[^a-z]/g,'').includes('family'));
if(idx===-1) idx=headers.findIndex(h=>String(h).toLowerCase().includes('parivar'));
if(idx===-1) idx=0;
return idx;
}
document.getElementById('sprFile').addEventListener('change',async e=>{
let aoa=await readFile(e.target.files[0]);
sprHeaders=aoa[0]; sprData=aoa.slice(1).filter(r=>r.join('').trim()!=='');
document.getElementById('sprInfo').textContent='SPR Upload Ho Gayi: '+sprData.length+' Row';
let s=document.getElementById('sprCol'); s.innerHTML=sprHeaders.map((h,i)=>`<option value="${i}">${h}</option>`).join('');
s.value=findFamilyCol(sprHeaders);
});
document.getElementById('prdFiles').addEventListener('change',async e=>{
prdData=[]; let allHeaders=new Set();
for(let f of e.target.files){
let aoa=await readFile(f);
let h=aoa[0]; h.forEach(x=>allHeaders.add(x));
let rows=aoa.slice(1).filter(r=>r.join('').trim()!=='');
// header ko align karke jodo
if(prdHeaders.length===0) prdHeaders=h;
rows.forEach(r=>{ let obj={}; h.forEach((col,i)=>obj[col]=r[i]); prdData.push(obj); });
}
document.getElementById('prdInfo').textContent='PRD Upload Ho Gayi: '+e.target.files.length+' Files, Total '+prdData.length+' Row';
let s=document.getElementById('prdCol'); let arr=[...allHeaders]; s.innerHTML=arr.map(h=>`<option value="${h}">${h}</option>`).join('');
let fIdx=arr.findIndex(h=>String(h).toLowerCase().replace(/[^a-z]/g,'').includes('family'));
if(fIdx>=0) s.value=arr[fIdx];
});

function clean(v){ return String(v||'').trim().replace(/\s+/g,''); }

function process(){
if(!sprData.length){alert('Pehle SPR Upload karo');return;}
if(!prdData.length){alert('Pehle PRD Upload karo');return;}
let sprColIdx=parseInt(document.getElementById('sprCol').value);
let prdColName=document.getElementById('prdCol').value;

// 1. PRD ke saare Family ID ek Set me
let prdSet=new Set(prdData.map(r=>clean(r[prdColName])).filter(v=>v));

// 2. SPR se Duplicate Family ID Remove - Unique
let seen=new Set(); let sprUnique=[];
sprData.forEach(r=>{
let fid=clean(r[sprColIdx]); if(!fid) return;
if(!seen.has(fid)){ seen.add(fid); sprUnique.push(r); }
});

// 3. Matching
remaining=[]; matched=[];
sprUnique.forEach(r=>{
let fid=clean(r[sprColIdx]);
if(prdSet.has(fid)) matched.push(r); else remaining.push(r);
});

document.getElementById('c1').textContent=sprData.length;
document.getElementById('c2').textContent=sprUnique.length;
document.getElementById('c3').textContent=prdSet.size;
document.getElementById('c4').textContent=matched.length;
document.getElementById('c5').textContent=remaining.length;

document.getElementById('th').innerHTML='<tr>'+sprHeaders.map(h=>`<th>${h}</th>`).join('')+'</tr>';
show(remaining);
alert('Ho Gaya!\\nSPR Unique: '+sprUnique.length+'\\nMatch: '+matched.length+'\\nRemaining SPR: '+remaining.length);
}
function show(data){
document.getElementById('tb').innerHTML=data.slice(0,500).map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
window._show=data;
}
function doSearch(){
let q=document.getElementById('search').value.toLowerCase();
if(!q) return show(remaining);
show(remaining.filter(r=>r.join(' ').toLowerCase().includes(q)));
}
function download(){
if(!remaining.length){alert('Pehle MATCH KARO dabao');return;}
let ws=XLSX.utils.aoa_to_sheet([sprHeaders,...remaining]);
let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Remaining SPR');
XLSX.writeFile(wb,'Remaining_SPR.xlsx');
}
function downloadMatched(){
if(!matched.length){alert('Pehle MATCH KARO dabao');return;}
let ws=XLSX.utils.aoa_to_sheet([sprHeaders,...matched]);
let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Matched');
XLSX.writeFile(wb,'Matched_SPR.xlsx');
}
</script>
</body>
</html>
