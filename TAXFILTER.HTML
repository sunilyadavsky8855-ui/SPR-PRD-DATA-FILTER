<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPR Duplicate Remove</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>body{font-family:Segoe UI;padding:15px;background:#fefce8}h1{color:#a16207}input,select{width:95%;padding:11px;border:2px solid #a16207;border-radius:8px;background:#fff;margin:5px 0}button{width:100%;padding:13px;background:#a16207;color:#fff;border:none;border-radius:10px;font-weight:700;margin:8px 0;font-size:16px}.box{background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 8px #ddd}.card{display:flex;gap:8px}.card div{flex:1;background:#fff;padding:10px;border-radius:10px;text-align:center;box-shadow:0 1px 5px #ddd}.card b{font-size:22px;display:block;color:#a16207}table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{background:#a16207;color:#fff}</style>
</head>
<body>
<h1>🧹 SPR - Duplicate Family ID Hatao</h1>

<div class="box">
<h3>STEP 1: SPR Sheet Upload Karo</h3>
<input type="file" id="f" accept=".xlsx,.xls,.csv">
<p id="info">Abhi file upload nahi hui</p>
<label>Family ID wala Column chuno:</label>
<select id="colSel"></select>
</div>

<button onclick="removeDup()">✨ DUPLICATE HATAO</button>

<div class="card">
<div>Total SPR<b id="c1">0</b></div>
<div>Duplicate Hata<b id="c2">0</b></div>
<div style="background:#dcfce7">Unique SPR<b id="c3" style="color:#15803d">0</b></div>
</div>
<br>
<div class="box">
<input type="text" id="search" placeholder="Unique me Naam / Gaon / Family ID se khojo..." onkeyup="doSearch()">
</div>
<div style="overflow:auto"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
<br>
<button onclick="download()">⬇️ UNIQUE SPR Excel Download Karo</button>
<button onclick="downloadDup()" style="background:#dc2626">⬇️ Duplicate Wali List Download Karo</button>

<script>
let headers=[], allData=[], uniqueData=[], dupData=[];
document.getElementById('f').addEventListener('change',e=>{
let file=e.target.files[0]; if(!file) return;
let r=new FileReader();
r.onload=ev=>{
let wb=XLSX.read(ev.target.result,{type:'array'});
let ws=wb.Sheets[wb.SheetNames[0]];
let aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
headers=aoa[0]; allData=aoa.slice(1).filter(row=>row.join('').trim()!=='');
document.getElementById('info').textContent='Upload Ho Gayi: '+allData.length+' Row';
let s=document.getElementById('colSel'); s.innerHTML=headers.map((h,i)=>`<option value="${i}">${h}</option>`).join('');
// Auto Family ID dhoondho
let idx=headers.findIndex(h=>String(h).toLowerCase().replace(/[^a-z]/g,'').includes('family'));
if(idx>=0) s.value=idx;
document.getElementById('th').innerHTML='<tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr>';
show(allData);
};
r.readAsArrayBuffer(file);
});
function clean(v){return String(v||'').trim().replace(/\s+/g,'');}
function removeDup(){
if(!allData.length){alert('Pehle SPR Upload karo');return;}
let ci=parseInt(document.getElementById('colSel').value);
let seen=new Set(); uniqueData=[]; dupData=[];
allData.forEach(row=>{
let fid=clean(row[ci]);
if(!fid){uniqueData.push(row); return;}
if(seen.has(fid)){dupData.push(row);} else {seen.add(fid); uniqueData.push(row);}
});
document.getElementById('c1').textContent=allData.length;
document.getElementById('c2').textContent=dupData.length;
document.getElementById('c3').textContent=uniqueData.length;
show(uniqueData);
alert('Ho Gaya!\\nTotal: '+allData.length+'\\nDuplicate Hata: '+dupData.length+'\\nUnique Bacha: '+uniqueData.length);
}
function show(data){
document.getElementById('tb').innerHTML=data.slice(0,500).map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
window._show=data;
}
function doSearch(){
let q=document.getElementById('search').value.toLowerCase();
let base=uniqueData.length?uniqueData:allData;
if(!q) return show(base);
show(base.filter(r=>r.join(' ').toLowerCase().includes(q)));
}
function download(){
let data=uniqueData.length?uniqueData:allData;
if(!data.length){alert('Pehle SPR Upload karo');return;}
let ws=XLSX.utils.aoa_to_sheet([headers,...data]);
let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Unique SPR');
XLSX.writeFile(wb,'SPR_Unique.xlsx');
}
function downloadDup(){
if(!dupData.length){alert('Koi Duplicate nahi mila ya pehle DUPLICATE HATAO dabao');return;}
let ws=XLSX.utils.aoa_to_sheet([headers,...dupData]);
let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Duplicate');
XLSX.writeFile(wb,'SPR_Duplicate.xlsx');
}
</script>
</body>
</html>
