<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>PRD Row Ginti - 123456789</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Arial;background:#111;color:#fff;padding:12px;text-align:center}
.card{max-width:900px;margin:auto;background:#fff;color:#000;padding:20px;border-radius:12px}
button{padding:13px;width:100%;margin:6px 0;border-radius:8px;border:none;font-weight:bold;cursor:pointer}
#main{display:none}
input[type=file]{padding:10px;border:2px dashed #0d6efd;border-radius:8px;width:95%;margin:8px 0;background:#f8f9ff}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px} th,td{border:1px solid #ccc;padding:6px} th{background:#0d6efd;color:#fff}
</style>
</head>
<body>

<div id="lock" class="card">
<h2>🔒🏛️ PANCHAYAT DARPAN PORTAL
SAMAGRA DATA AUR PANCHAYAT DARPAN PAR PANJIYAN KE LIYE FILTER FILE Password: 123456789</h2>
<input id="p" type="password" placeholder="123456789" style="padding:14px;width:90%;border-radius:8px;border:1px solid #ccc;text-align:center;font-size:18px">
<button onclick="if(document.getElementById('p').value==='123456789'){document.getElementById('lock').style.display='none';document.getElementById('main').style.display='block'}else{alert('Galat')}" style="background:#0d6efd;color:#fff">Unlock</button>
</div>

<div id="main" class="card">
<h2>PRD Alag-Alag Row Ginti Tool</h2>
<label style="font-weight:bold;display:block;text-align:left">STEP 1: INSERT SPR SHEET</label>
<input type="file" id="sprFile" accept=".xlsx,.xls">
<label style="font-weight:bold;display:block;text-align:left">STEP 2: INSERT PRD SHEETS (Multiple)</label>
<input type="file" id="prdFiles" accept=".xlsx,.xls" multiple>
<button onclick="process()" style="background:#0d6efd;color:#fff">PROCESS - Row Ginti + Duplicate</button>
<button onclick="downloadAll()" id="dl" style="background:#198754;color:#fff;display:none">FINAL 6 SHEETS DOWNLOAD</button>
<div id="log" style="background:#000;color:#0f0;padding:10px;border-radius:6px;text-align:left;white-space:pre-line;min-height:80px"></div>
<div style="max-height:300px;overflow:auto"><table id="tbl"></table></div>
</div>

<script>
let sprWb=null, prdWbs=[], finalSPR=[], extractedPRD=[], duplicatePRD=[], matched=[], notMatched=[], rowCounts=[], masterSet=new Set();

function unmerge(ws,data){
 if(ws['!merges']) ws['!merges'].forEach(m=>{ let v=data[m.s.r]?.[m.s.c]||""; for(let R=m.s.r;R<=m.e.r;R++) for(let C=m.s.c;C<=m.e.c;C++){ if(!data[R])data[R]=[]; data[R][C]=v; } });
 for(let i=1;i<data.length;i++){ if(!data[i])data[i]=[]; if((!data[i][1]||String(data[i][1]).trim()=="") && data[i-1]?.[1]) data[i][1]=data[i-1][1]; }
 return data;
}
function extract8Digit(text){ let m=String(text||"").match(/\d{8}/); return m?m[0]:""; }

document.getElementById('sprFile').addEventListener('change',e=>{
 let r=new FileReader(); r.onload=x=>{ sprWb=XLSX.read(x.target.result,{type:'array'}); }; r.readAsArrayBuffer(e.target.files[0]);
});
document.getElementById('prdFiles').addEventListener('change',e=>{
 prdWbs=[]; let files=[...e.target.files];
 Promise.all(files.map(f=> new Promise(res=>{ let r=new FileReader(); r.onload=x=>{ prdWbs.push({name:f.name,wb:XLSX.read(x.target.result,{type:'array'})}); res(); }; r.readAsArrayBuffer(f); }))).then(()=>{ document.getElementById('log').innerText=`PRD Files: ${files.length} Ready`; });
});

function process(){
 if(!sprWb || prdWbs.length==0){alert("File dalo");return;}

 // SPR
 let ws1=sprWb.Sheets[sprWb.SheetNames[0]]; let d1=XLSX.utils.sheet_to_json(ws1,{header:1,defval:""}); d1=unmerge(ws1,d1);
 let seenSPR={}; let hSPR=d1[0]; finalSPR=[hSPR]; masterSet=new Set();
 for(let i=1;i<d1.length;i++){ let fid=extract8Digit(d1[i][1])||String(d1[i][1]||"").trim(); if(!fid) continue; if(!seenSPR[fid]){ seenSPR[fid]=1; masterSet.add(fid); finalSPR.push(d1[i]); } }

 // PRD - ALAG ALAG ROW GINTI
 let allRows=[]; let hPRD=null; rowCounts=[["File Name","Sheet Name","Total Rows","Unique Rows","Duplicate Rows","8-Digit Found"]];
 let newHeader=null;

 prdWbs.forEach(item=>{
   item.wb.SheetNames.forEach(sName=>{
     let ws=item.wb.Sheets[sName]; let d=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}); d=unmerge(ws,d);
     if(!hPRD) hPRD=d[0];
     if(!newHeader) newHeader=(hPRD||[]).slice().concat(["8_Digit_Family_ID","Source_File","Source_Sheet"]);

     let totalRows = d.length-1;
     let seenLocal={}; let dupLocal=0; let uniqueLocal=0; let eightFound=0;
     let tempRows=[];

     for(let i=1;i<d.length;i++){
       let orig=String(d[i][1]||"").trim(); let eight=extract8Digit(orig); if(!eight) continue; eightFound++;
       if(!seenLocal[eight]){ seenLocal[eight]=1; uniqueLocal++; tempRows.push([d[i],eight,item.name,sName]); }
       else dupLocal++;
     }

     rowCounts.push([item.name, sName, totalRows, uniqueLocal, dupLocal, eightFound]);
     tempRows.forEach(t=>{ allRows.push(t); });
   });
 });

 // UNIQUE + DUPLICATE ALAG
 let extractedHeader = newHeader;
 extractedPRD=[extractedHeader];
 duplicatePRD=[extractedHeader.concat(["Duplicate_Count"])];

 let seenGlobal={}; let countGlobal={};
 allRows.forEach(obj=>{
   let eight=obj[1];
   if(!countGlobal[eight]) countGlobal[eight]=0; countGlobal[eight]++;

   if(!seenGlobal[eight]){
     seenGlobal[eight]=1;
     let row = obj[0].slice(); row.push(eight, obj[2], obj[3]);
     extractedPRD.push(row);
   } else {
     let row = obj[0].slice(); row.push(eight, obj[2], obj[3]); row.push(countGlobal[eight]);
     duplicatePRD.push(row);
   }
 });

 // MATCH
 matched=[extractedHeader.concat(["Status"])]; notMatched=[extractedHeader.concat(["Status"])];
 extractedPRD.slice(1).forEach(row=>{
   let eight=String(row[row.length-3]||"").trim();
   if(masterSet.has(eight)) matched.push(row.concat(["MATCHED"]));
   else notMatched.push(row.concat(["NOT_MATCHED"]));
 });

 // Table dikhao
 let html="<tr><th>File</th><th>Sheet</th><th>Total</th><th>Unique</th><th>Duplicate</th><th>8-Digit</th></tr>";
 rowCounts.slice(1).forEach(r=>{ html+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`; });
 document.getElementById('tbl').innerHTML=html;

 document.getElementById('log').innerText=`SPR Unique: ${finalSPR.length-1}\nPRD Sheets: ${rowCounts.length-1} Sheets Counted\nTotal PRD Unique: ${extractedPRD.length-1}\nDuplicate: ${duplicatePRD.length-1}\nMatched: ${matched.length-1} | Not Matched: ${notMatched.length-1}`;
 document.getElementById('dl').style.display='block';
}

function downloadAll(){
 let newWb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(rowCounts), "0_PRD_Sheet_Wise_Row_Ginti");
 XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(finalSPR), "1_SPR_Sheet");
 XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(extractedPRD), "2_PRD_Unique_8Digit");
 XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(duplicatePRD), "3_PRD_DUPLICATE_ALAG");
 XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(matched), "4_Matched");
 XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(notMatched), "5_Not_Matched");
 XLSX.writeFile(newWb,"FINAL_ROW_GINTI_"+Date.now()+".xlsx");
}
</script>
</body>
</html>
