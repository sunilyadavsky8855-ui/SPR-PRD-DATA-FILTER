
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>सम्मेलन वर-वधु पंजीयन फॉर्म</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    padding: 15px;
}
.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 10px #ccc;
}
h2 {
    text-align: center;
    color: #174b80;
}
label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}
input, select {
    width: 100%;
    padding: 11px;
    margin-top: 5px;
    box-sizing: border-box;
    border: 1px solid #bbb;
    border-radius: 5px;
}
button {
    padding: 12px;
    margin-top: 15px;
    background: #1769aa;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
.submit {
    width: 100%;
    font-size: 17px;
}
.download {
    background: #168447;
    width: 100%;
    font-size: 16px;
}
#message {
    text-align: center;
    font-weight: bold;
}
.table-box {
    overflow-x: auto;
    margin-top: 20px;
}
table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}
th, td {
    border: 1px solid #ddd;
    padding: 9px;
    text-align: left;
}
th {
    background: #1769aa;
    color: white;
}
.count {
    text-align: center;
    font-size: 22px;
    color: #1769aa;
    font-weight: bold;
    margin: 15px;
}
</style>
</head>

<body>

<div class="container">

<h2>सम्मेलन वर-वधु पंजीयन फॉर्म</h2>

<div class="count">
कुल पंजीयन: <span id="total">0</span>
</div>

<form id="registrationForm">

<label>पंजीयन प्रकार</label>
<select id="type" required>
<option value="">चुनें</option>
<option value="वर">वर</option>
<option value="वधु">वधु</option>
</select>

<label>पंजीयन क्रमांक</label>
<input type="text" id="regNo" required>

<label>व्यक्ति का नाम</label>
<input type="text" id="name" required>

<label>मोबाइल नंबर</label>
<input type="tel" id="mobile"
pattern="[0-9]{10}" maxlength="10" required>

<label>गाँव का नाम</label>
<input type="text" id="village" required>

<label>तहसील</label>
<input type="text" id="tehsil" required>

<label>जिला</label>
<input type="text" id="district" required>

<button type="submit" class="submit">
पंजीयन करें
</button>

</form>

<p id="message"></p>

<hr>

<h2>पंजीयन सूची</h2>

<button type="button" class="download" onclick="downloadExcel()">
Excel डाउनलोड करें
</button>

<div class="table-box">
<table>
<thead>
<tr>
<th>क्रमांक</th>
<th>प्रकार</th>
<th>पंजीयन नंबर</th>
<th>नाम</th>
<th>मोबाइल</th>
<th>गाँव</th>
<th>तहसील</th>
<th>जिला</th>
</tr>
</thead>
<tbody id="registrationList"></tbody>
</table>
</div>

</div>

<script>

const STORAGE_KEY = "sammelan_registrations";

let registrations = [];

try {
    registrations = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
    );

    if (!Array.isArray(registrations)) {
        registrations = [];
    }
} catch (error) {
    registrations = [];
}

const form = document.getElementById("registrationForm");
const message = document.getElementById("message");

function saveData() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(registrations)
    );
}

function showData() {

    const list = document.getElementById("registrationList");
    list.replaceChildren();

    registrations.forEach((item, index) => {

        const row = document.createElement("tr");

        [
            index + 1,
            item.type || "पुराना रिकॉर्ड",
            item.regNo,
            item.name,
            item.mobile,
            item.village,
            item.tehsil,
            item.district
        ].forEach(value => {

            const cell = document.createElement("td");
            cell.textContent = value ?? "";
            row.appendChild(cell);

        });

        list.appendChild(row);
    });

    document.getElementById("total").textContent =
        registrations.length;
}

form.addEventListener("submit", function(e) {

    e.preventDefault();

    const data = {
        type: document.getElementById("type").value,
        regNo: document.getElementById("regNo").value.trim(),
        name: document.getElementById("name").value.trim(),
        mobile: document.getElementById("mobile").value.trim(),
        village: document.getElementById("village").value.trim(),
        tehsil: document.getElementById("tehsil").value.trim(),
        district: document.getElementById("district").value.trim()
    };

    const duplicate = registrations.some(item =>
        item.regNo.toLowerCase() === data.regNo.toLowerCase() ||
        item.mobile === data.mobile
    );

    if (duplicate) {
        message.style.color = "red";
        message.textContent =
            "यह पंजीयन क्रमांक या मोबाइल नंबर पहले से मौजूद है!";
        return;
    }

    registrations.push(data);

    try {
        saveData();
    } catch (error) {
        registrations.pop();
        message.style.color = "red";
        message.textContent =
            "डेटा सेव नहीं हुआ। ब्राउज़र स्टोरेज जाँचें।";
        return;
    }

    showData();

    message.style.color = "green";
    message.textContent = "पंजीयन सफलतापूर्वक सेव हो गया!";

    form.reset();
});

// Excel डाउनलोड

function downloadExcel() {

    if (registrations.length === 0) {
        alert("डाउनलोड करने के लिए कोई पंजीयन उपलब्ध नहीं है।");
        return;
    }

    const headers = [
        "क्रमांक",
        "प्रकार",
        "पंजीयन नंबर",
        "नाम",
        "मोबाइल",
        "गाँव",
        "तहसील",
        "जिला"
    ];

    const rows = registrations.map((item, index) => [
        index + 1,
        item.type || "पुराना रिकॉर्ड",
        item.regNo,
        item.name,
        item.mobile,
        item.village,
        item.tehsil,
        item.district
    ]);

    function escapeCSV(value) {
        let text = String(value ?? "");

        if (/^[\s]*[=+\-@]/.test(text)) {
            text = "'" + text;
        }

        return '"' + text.replace(/"/g, '""') + '"';
    }

    const csv = [headers, ...rows]
        .map(row => row.map(escapeCSV).join(","))
        .join("\r\n");

    const blob = new Blob(
        ["\uFEFF" + csv],
        { type: "text/csv;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "सम्मेलन_वर-वधु_पंजीयन.csv";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
}

showData();

</script>

</body>
</html>
