<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPR Sammelan - Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff7ed;color:#1c1917}
.top{background:#ea580c;color:#fff;padding:14px;text-align:center}
.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;font-size:13px;opacity:.9}
.card{max-width:480px;margin:18px auto;background:#fff;border:1px solid #fed7aa;border-radius:14px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
h2{margin:0 0 12px}label{font-size:13px;font-weight:700;display:block;margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #e7e5e4;border-radius:10px;font-size:15px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#ea580c;color:#fff;font-weight:800;font-size:16px;margin-top:14px;cursor:pointer}
button.sec{background:#fff;color:#ea580c;border:1px solid #ea580c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:22px;display:block}.stat span{font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{width:auto;padding:9px 12px;margin:0}
.hidden{display:none}.msg{margin-top:10px;font-size:14px;color:#dc2626;text-align:center}.ok{color:#16a34a}
.small{font-size:12px;color:#78716c;text-align:center;margin-top:10px}
</style></head>
<body>
<div class="top"><h1>🏵️ SPR Sammelan</h1><p>Registration • Donation • Expense • Operator</p></div>

<!-- LOGIN -->
<div id="loginBox" class="card">
<h2>Login</h2>
<label>Username</label><input id="u" placeholder="admin">
<label>Password</label><input id="p" type="password" placeholder="Admin@123">
<button onclick="doLogin()">Login Karein</button>
<div id="loginMsg" class="msg"></div>
<div class="small">Admin: admin / Admin@123<br>Login ke baad Dashboard khulega</div>
</div>

<!-- APP -->
<div id="appBox" class="card hidden" style="max-width:720px">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 id="welcome">Namaste</h2><button onclick="logout()" style="width:auto;padding:8px 12px;background:#dc2626">Logout</button></div>
<div class="grid" style="margin-top:10px">
<div class="stat"><b id="sReg">0</b><span>Registrations</span></div>
<div class="stat"><b id="sDon">₹0</b><span>Total Donation</span></div>
<div class="stat"><b id="sExp">₹0</b><span>Total Expense</span></div>
<div class="stat"><b id="sBal">₹0</b><span>Balance</span></div>
</div>
<div class="tabs" style="margin-top:14px">
<button class="sec" onclick="showTab('reg')">+ Registration</button>
<button class="sec" onclick="showTab('don')">+ Donation</button>
<button class="sec" onclick="showTab('exp')">+ Expense</button>
<button class="sec" onclick="showTab('op')">+ Operator</button>
<button class="sec" onclick="loadDash()">🔄 Refresh</button>
</div>

<!-- REG -->
<div id="tab-reg" class="hidden">
<label>Village</label><input id="rVillage" placeholder="Gaon ka naam">
<label>Groom / Dulha</label><input id="rGroom">
<label>Bride / Dulhan</label><input id="rBride">
<label>Father Name</label><input id="rFather">
<label>Mobile</label><input id="rMobile">
<label>Amount</label><input id="rAmount" type="number">
<button onclick="saveReg()">Registration Save Karein</button><div id="regMsg" class="msg"></div>
</div>
<!-- DON -->
<div id="tab-don" class="hidden">
<label>Village</label><input id="dVillage">
<label>Name</label><input id="dName">
<label>Father</label><input id="dFather">
<label>Amount</label><input id="dAmount" type="number">
<label>Type</label><select id="dType"><option>सामान्य</option><option>गुप्त</option><option>विशेष</option></select>
<button onclick="saveDon()">Donation Save Karein</button><div id="donMsg" class="msg"></div>
</div>
<!-- EXP -->
<div id="tab-exp" class="hidden">
<label>Item</label><input id="eItem" placeholder="Kis cheez ka kharcha">
<label>Description</label><input id="eDesc">
<label>Paid By</label><input id="ePaid">
<label>Amount</label><input id="eAmount" type="number">
<button onclick="saveExp()">Expense Save Karein</button><div id="expMsg" class="msg"></div>
</div>
<!-- OP -->
<div id="tab-op" class="hidden">
<label>New Operator Username</label><input id="oUser">
<label>Password</label><input id="oPass">
<label>Name</label><input id="oName">
<button onclick="addOp()">Operator Banayein</button><div id="opMsg" class="msg"></div>
<div class="small">Sirf Admin hi Operator bana sakta hai</div>
</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzqtVUYmdgMwMwxTqGG2bM7eSsFGD_b-h3JXcTrHvXFXzWWKJ9GUs6LIno5jpyIXH-1Ig/exec";
let TOKEN = localStorage.getItem("spr_token") || "";
async function call(action, data={}){ const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token:TOKEN,...data})}); return r.json(); }
async function doLogin(){
  const username=document.getElementById("u").value.trim(), password=document.getElementById("p").value.trim();
  document.getElementById("loginMsg").textContent="Login ho raha hai...";
  try{ const res=await call("login",{username,password});
    if(!res.success){ document.getElementById("loginMsg").textContent=res.message; return; }
    TOKEN=res.token; localStorage.setItem("spr_token",TOKEN);
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("appBox").classList.remove("hidden");
    document.getElementById("welcome").textContent="Namaste, "+(res.name||res.role);
    loadDash(); showTab("reg");
  }catch(e){ document.getElementById("loginMsg").textContent="Network Error: "+e.message; }
}
async function loadDash(){ try{ const res=await call("dashboard",{}); if(!res.success){ logout(); return; }
  document.getElementById("sReg").textContent=res.registrations;
  document.getElementById("sDon").textContent="₹"+res.donation;
  document.getElementById("sExp").textContent="₹"+res.expenses;
  document.getElementById("sBal").textContent="₹"+res.balance;
}catch(e){} }
function showTab(t){ ["reg","don","exp","op"].forEach(x=>document.getElementById("tab-"+x).classList.add("hidden")); document.getElementById("tab-"+t).classList.remove("hidden"); }
async function saveReg(){ const data={village:v("rVillage"),groom:v("rGroom"),bride:v("rBride"),father:v("rFather"),mobile:v("rMobile"),amount:v("rAmount")}; const r=await call("saveReg",{data}); document.getElementById("regMsg").textContent=r.success?"Ho gaya! Receipt: "+r.receipt:r.message; if(r.success) loadDash(); }
async function saveDon(){ const data={village:v("dVillage"),name:v("dName"),father:v("dFather"),amount:v("dAmount"),type:v("dType")}; const r=await call("saveDon",{data}); document.getElementById("donMsg").textContent=r.success?"Ho gaya! Receipt: "+r.receipt:r.message; if(r.success) loadDash(); }
async function saveExp(){ const data={item:v("eItem"),description:v("eDesc"),paidBy:v("ePaid"),amount:v("eAmount")}; const r=await call("saveExp",{data}); document.getElementById("expMsg").textContent=r.success?"Ho gaya! Receipt: "+r.receipt:r.message; if(r.success) loadDash(); }
async function addOp(){ const data={username:v("oUser"),password:v("oPass"),name:v("oName")}; const r=await call("addOp",{data}); document.getElementById("opMsg").textContent=r.success?r.message:r.message; }
function v(id){ return document.getElementById(id).value.trim(); }
function logout(){ localStorage.removeItem("spr_token"); TOKEN=""; location.reload(); }
if(TOKEN){ document.getElementById("loginBox").classList.add("hidden"); document.getElementById("appBox").classList.remove("hidden"); loadDash(); showTab("reg"); }
</script></body></html>
